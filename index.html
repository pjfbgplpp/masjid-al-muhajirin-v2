    <script>
      (function() {
        function suppressWsNotice(e) {
          try {
            var reason = e && (e.reason || e.error || e.message);
            var str = '';
            if (typeof reason === 'string') str = reason;
            else if (reason && typeof reason.message === 'string') str = reason.message;
            else str = String(reason || '');
            if (
              str.indexOf('WebSocket') !== -1 ||
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('closed without opened') !== -1
            ) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopPropagation) e.stopPropagation();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          } catch (err) {}
        }
        window.addEventListener('unhandledrejection', suppressWsNotice, true);
        window.addEventListener('error', suppressWsNotice, true);
      })();
    </script>
